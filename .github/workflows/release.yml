name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag（如 v0.20.0）；留空则使用当前 ref
        required: false

permissions:
  contents: write

jobs:
  windows:
    name: build windows artifacts
    runs-on: windows-latest
    env:
      CI: 'true'
      # 不做代码签名（无证书）；显式关闭自动发现，避免 CI 里报签名警告
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm run test:coverage

      - name: Package
        # 有签名证书时（仓库 secrets 配置 CSC_LINK / CSC_KEY_PASSWORD）electron-builder 会自动签名；
        # 没配置则跳过签名，产物仍可运行（SmartScreen 会提示未知发布者）。
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: node scripts/release.mjs --skip-check

      - name: Resolve release notes
        id: notes
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "path=release/RELEASE-$version.md" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt
            release/RELEASE-*.md
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
