name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 是目标平台；ubuntu 用来兜底跨平台回归
        os: [windows-latest, ubuntu-latest]
    env:
      CI: 'true'
      # CI 只做类型检查/测试/构建，不需要 Electron 运行时二进制，跳过可省 ~100MB 下载
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify model catalog is in sync with SDK
        shell: bash
        run: |
          npm run gen:catalog
          git diff --exit-code src/shared/model-catalog.json

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: out/
          retention-days: 7
          if-no-files-found: error
