name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 是目标平台；ubuntu 用来兜底跨平台回归
        os: [windows-latest, ubuntu-latest]
    env:
      CI: 'true'
      # CI 只做类型检查/测试/构建，不需要 Electron 运行时二进制，跳过可省 ~100MB 下载
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 用 npm install 而非 npm ci：electron-builder 的签名/打包工具是跨平台 optional deps，
      # 在 Windows 上生成的 lockfile 不含 Linux 变体，npm ci 在 ubuntu runner 上会报 Missing。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify model catalog is in sync with SDK
        shell: bash
        run: |
          npm run gen:catalog
          git diff --exit-code src/shared/model-catalog.json

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: warn

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: out/
          retention-days: 7
          if-no-files-found: error
